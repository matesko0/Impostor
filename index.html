<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Impostor Online</title>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

<div id="app" class="flex-1 flex flex-col w-full max-w-md mx-auto px-6 safe-top safe-bottom">
    
    <div id="screen-login" class="flex-1 flex flex-col justify-center space-y-6 fade-in">
        <div class="text-center">
            <h1 class="text-5xl font-black text-indigo-500 mb-2 tracking-tighter">IMPOSTOR</h1>
            <p class="text-slate-500 uppercase tracking-widest text-xs font-bold italic">Online Edition</p>
        </div>
        <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800 space-y-4">
            <input type="text" id="user-name" placeholder="Tvoje jméno..." 
                class="w-full bg-slate-800 border-none rounded-2xl p-4 text-lg outline-none focus:ring-2 focus:ring-indigo-500 text-white">
            <input type="text" id="room-id" placeholder="Místnost (např. Pivo)" 
                class="w-full bg-slate-800 border-none rounded-2xl p-4 text-lg outline-none focus:ring-2 focus:ring-indigo-500 uppercase text-white font-mono">
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="window.joinRoom(true)" class="bg-indigo-600 p-4 rounded-2xl font-bold active:scale-95 transition-all shadow-lg shadow-indigo-500/20">ZALOŽIT</button>
                <button onclick="window.joinRoom(false)" class="bg-slate-800 p-4 rounded-2xl font-bold active:scale-95 transition-all border border-slate-700">PŘIPOJIT</button>
            </div>
        </div>
    </div>

    <div id="screen-lobby" class="hidden flex-1 flex flex-col py-6 fade-in">
        <div class="text-center mb-8">
            <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">Místnost</span>
            <h2 id="display-room" class="text-3xl font-black text-indigo-400 uppercase">---</h2>
        </div>
        
        <div class="flex-1 space-y-4 overflow-y-auto">
            <h3 class="text-sm font-bold text-slate-500 px-2 uppercase">Hráči (min. 3):</h3>
            <ul id="online-player-list" class="space-y-2"></ul>
        </div>

        <div id="lobby-footer" class="space-y-4 pt-6">
            <button id="host-start-btn" onclick="window.triggerGameStart()" 
                class="hidden w-full bg-emerald-600 p-5 rounded-3xl font-black text-xl shadow-xl active:scale-95 transition-all">
                START HRY
            </button>
            <p id="wait-msg" class="text-center text-slate-500 italic text-sm py-4">Čekáme na hostitele...</p>
        </div>
    </div>

    <div id="screen-game" class="hidden flex-1 flex flex-col justify-center py-6 fade-in text-center">
        <div class="bg-slate-900/80 p-8 rounded-[40px] border border-slate-800 space-y-8 shadow-2xl">
            <div id="reveal-controls">
                <span class="text-indigo-400 font-bold uppercase text-xs tracking-widest mb-2 block">Kolo začalo</span>
                <h2 id="player-turn-name" class="text-4xl font-black mb-6">---</h2>
                <button onclick="window.revealMyRole()" class="w-full h-40 bg-gradient-to-br from-indigo-600 to-purple-700 rounded-3xl text-xl font-black shadow-2xl active:scale-95 transition-all">
                    TAPNI PRO <br>ZOBRAZENÍ ROLE
                </button>
            </div>
            
            <div id="role-info" class="hidden py-4">
                <p id="role-label" class="text-slate-500 text-xs uppercase font-bold mb-2"></p>
                <div id="role-word" class="text-5xl font-black mb-8 tracking-tighter italic">---</div>
                <p class="text-slate-400 text-sm leading-relaxed px-4 text-center">
                    Diskutujte! Hledejte toho, kdo má nápovědu místo slova.
                </p>
            </div>
        </div>
        <button id="host-reset-btn" onclick="window.triggerGameStart()" class="hidden mt-8 w-full bg-slate-800 py-4 rounded-2xl font-bold border border-slate-700 active:scale-95 transition-all">DALŠÍ KOLO</button>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    // Konfigurace z tvého Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyA7CZjBnw597T5IsC00-2iAcuVdqegq7wU",
        authDomain: "impos-9d3d4.firebaseapp.com",
        databaseURL: "https://impos-9d3d4-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "impos-9d3d4",
        storageBucket: "impos-9d3d4.firebasestorage.app",
        messagingSenderId: "909569492432",
        appId: "1:909569492432:web:18fdf5a73d46129ef9a5d5",
        measurementId: "G-N6YSHR8CRN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // UNIKÁTNÍ IDENTIFIKACE ZAŘÍZENÍ
    let myId = localStorage.getItem('impostor_uid');
    if (!myId) {
        myId = 'user_' + Math.random().toString(36).substring(2, 11);
        localStorage.setItem('impostor_uid', myId);
    }
    
    let myName = localStorage.getItem('impostor_name') || '';
    let myRoom = '';
    let isHost = false;

    document.getElementById('user-name').value = myName;

    const items = [
        { word: "Kladivo", hint: "Nářadí" }, { word: "Pánvička", hint: "Kuchyně" }, 
        { word: "Notebook", hint: "Elektronika" }, { word: "Postel", hint: "Nábytek" },
        { word: "Bunda", hint: "Oblečení" }, { word: "Kolo", hint: "Sport" },
        { word: "Vrtačka", hint: "Nářadí" }, { word: "Mixér", hint: "Kuchyně" },
        { word: "Lednice", hint: "Spotřebič" }, { word: "Tablet", hint: "Elektronika" },
        { word: "Gauč", hint: "Nábytek" }, { word: "Boty", hint: "Oblečení" },
        { word: "Sluchátka", hint: "Elektronika" }, { word: "Klíče", hint: "Kapsa" },
        { word: "Zrcadlo", hint: "Koupelna" }, { word: "Batoh", hint: "Záda" }
    ];

    window.joinRoom = function(create) {
        const nameInput = document.getElementById('user-name').value.trim();
        const roomInput = document.getElementById('room-id').value.trim().toUpperCase();
        
        if (!nameInput || !roomInput) return alert("Doplň jméno a kód místnosti!");
        
        myName = nameInput;
        myRoom = roomInput;
        localStorage.setItem('impostor_name', myName);
        isHost = create;

        if (isHost) {
            // Hostitel založí místnost, ale nepoužije set na celou cestu rooms
            update(ref(db, 'rooms/' + myRoom), {
                status: 'lobby',
                hostId: myId,
                createdAt: Date.now()
            });
        }

        // Každý se zapíše pod svým unikátním ID do seznamu hráčů
        update(ref(db, 'rooms/' + myRoom + '/players/' + myId), {
            name: myName,
            id: myId
        });

        listenToRoom();
        document.getElementById('display-room').innerText = myRoom;
    };

    function listenToRoom() {
        onValue(ref(db, 'rooms/' + myRoom), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const players = data.players || {};
            const playerArray = Object.values(players);
            
            // Renderování seznamu hráčů
            const listUI = document.getElementById('online-player-list');
            listUI.innerHTML = playerArray.map(p => `
                <li class="bg-slate-900 border ${p.id === myId ? 'border-indigo-500' : 'border-slate-800'} p-4 rounded-2xl flex justify-between items-center fade-in">
                    <span class="font-bold">${p.id === data.hostId ? '👑 ' : ''}${p.name}</span>
                    <span class="text-[10px] text-slate-500 font-bold">${p.id === myId ? 'TY' : 'HRÁČ'}</span>
                </li>
            `).join('');

            // Přepínání stavů
            if (data.status === 'lobby') {
                showScreen('screen-lobby');
                document.getElementById('host-start-btn').classList.toggle('hidden', myId !== data.hostId || playerArray.length < 3);
                document.getElementById('wait-msg').classList.toggle('hidden', myId === data.hostId);
            } else if (data.status === 'playing') {
                showScreen('screen-game');
                window.currentGameState = data.gameState;
                document.getElementById('player-turn-name').innerText = myName;
                document.getElementById('reveal-controls').classList.remove('hidden');
                document.getElementById('role-info').classList.add('hidden');
                document.getElementById('host-reset-btn').classList.toggle('hidden', myId !== data.hostId);
            }
        });
    }

    window.triggerGameStart = function() {
        get(ref(db, 'rooms/' + myRoom + '/players')).then((snap) => {
            const playerIds = Object.keys(snap.val());
            const impIdx = Math.floor(Math.random() * playerIds.length);
            const item = items[Math.floor(Math.random() * items.length)];

            update(ref(db, 'rooms/' + myRoom), {
                status: 'playing',
                gameState: {
                    impostorId: playerIds[impIdx],
                    word: item.word,
                    hint: item.hint
                }
            });
        });
    };

    window.revealMyRole = function() {
        const state = window.currentGameState;
        if (!state) return;
        
        const isImp = myId === state.impostorId;
        const roleLabel = document.getElementById('role-label');
        const roleWord = document.getElementById('role-word');
        
        roleLabel.innerText = isImp ? "Jsi IMPOSTOR. Kategorie:" : "Jsi CIVILISTA. Předmět:";
        roleWord.innerText = isImp ? state.hint : state.word;
        roleWord.className = `text-5xl font-black mb-8 tracking-tighter ${isImp ? 'text-rose-500' : 'text-emerald-400'}`;
        
        document.getElementById('reveal-controls').classList.add('hidden');
        document.getElementById('role-info').classList.remove('hidden');
    };

    function showScreen(id) {
        ['screen-login', 'screen-lobby', 'screen-game'].forEach(s => {
            document.getElementById(s).classList.add('hidden');
        });
        document.getElementById(id).classList.remove('hidden');
    }
</script>
</body>
</html>
