<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Impostor Online Pro</title>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

<div id="app" class="flex-1 flex flex-col w-full max-w-md mx-auto px-6 safe-top safe-bottom">
    
    <div id="screen-login" class="flex-1 flex flex-col justify-center space-y-6">
        <div class="text-center">
            <h1 class="text-5xl font-black text-indigo-500 mb-2 tracking-tighter italic text-shadow-lg">IMPOSTOR</h1>
            <p class="text-slate-500 uppercase tracking-widest text-xs font-bold italic">Online Multiplayer</p>
        </div>
        <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800 space-y-4 shadow-2xl">
            <input type="text" id="user-name" placeholder="Tvoje jméno..." 
                class="w-full bg-slate-800 border-none rounded-2xl p-4 text-lg outline-none focus:ring-2 focus:ring-indigo-500 text-white">
            <input type="text" id="room-id" placeholder="Název místnosti" 
                class="w-full bg-slate-800 border-none rounded-2xl p-4 text-lg outline-none focus:ring-2 focus:ring-indigo-500 uppercase text-white font-mono">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="window.joinRoom(true)" class="bg-indigo-600 p-4 rounded-2xl font-bold active:scale-95 transition-all">ZALOŽIT</button>
                <button onclick="window.joinRoom(false)" class="bg-slate-800 p-4 rounded-2xl font-bold active:scale-95 border border-slate-700">PŘIPOJIT</button>
            </div>
        </div>
    </div>

    <div id="screen-lobby" class="hidden flex-1 flex flex-col py-6">
        <div class="flex justify-between items-center mb-8">
            <button onclick="window.leaveRoom()" class="bg-slate-900 px-4 py-2 rounded-xl text-rose-500 font-bold text-xs border border-slate-800 active:scale-90 transition-all uppercase">Odejít</button>
            <div class="text-right">
                <span class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Místnost</span>
                <h2 id="display-room" class="text-2xl font-black text-indigo-400 uppercase">---</h2>
            </div>
        </div>
        
        <div class="flex-1 space-y-4 overflow-y-auto">
            <h3 class="text-sm font-bold text-slate-500 px-2 uppercase italic">Hráči v lobby:</h3>
            <ul id="online-player-list" class="space-y-2"></ul>
        </div>

        <div class="pt-6 space-y-4">
            <button id="host-start-btn" onclick="window.triggerGameStart()" 
                class="hidden w-full bg-emerald-600 p-5 rounded-3xl font-black text-xl shadow-xl active:scale-95 transition-all">
                START HRY
            </button>
            <p id="wait-msg" class="text-center text-slate-500 italic text-sm py-4">Čekáme na hostitele...</p>
        </div>
    </div>

    <div id="screen-game" class="hidden flex-1 flex flex-col justify-center py-6 text-center">
        <div class="flex justify-between items-center mb-6 px-2">
            <button onclick="window.leaveRoom()" class="text-rose-500 font-bold text-xs uppercase tracking-widest">Opustit hru</button>
            <span id="game-room-name" class="text-slate-700 font-bold text-xs uppercase tracking-tighter font-mono"></span>
        </div>

        <div class="bg-slate-900/80 p-8 rounded-[40px] border border-slate-800 space-y-8 shadow-2xl">
            <div id="reveal-controls">
                <h2 id="player-turn-name" class="text-4xl font-black mb-6">---</h2>
                <button onclick="window.revealMyRole()" class="w-full h-40 bg-gradient-to-br from-indigo-600 to-purple-700 rounded-3xl text-xl font-black shadow-2xl active:scale-95 transition-all">
                    TAPNI PRO <br>ODHALENÍ ROLE
                </button>
            </div>
            
            <div id="role-info" class="hidden py-4">
                <p id="role-label" class="text-slate-500 text-xs uppercase font-bold mb-2"></p>
                <div id="role-word" class="text-5xl font-black mb-8 tracking-tighter italic">---</div>
                <p class="text-slate-400 text-sm leading-relaxed px-4">
                    Hledejte toho, kdo má nápovědu!
                </p>
            </div>
        </div>
        <button id="host-reset-btn" onclick="window.triggerGameStart()" class="hidden mt-8 w-full bg-slate-800 py-4 rounded-2xl font-bold border border-slate-700 active:scale-95 transition-all">DALŠÍ KOLO</button>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, remove, off, onDisconnect } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA7CZjBnw597T5IsC00-2iAcuVdqegq7wU",
        authDomain: "impos-9d3d4.firebaseapp.com",
        databaseURL: "https://impos-9d3d4-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "impos-9d3d4",
        storageBucket: "impos-9d3d4.firebasestorage.app",
        messagingSenderId: "909569492432",
        appId: "1:909569492432:web:18fdf5a73d46129ef9a5d5",
        measurementId: "G-N6YSHR8CRN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myId = localStorage.getItem('impostor_uid') || 'user_' + Math.random().toString(36).substring(2, 11);
    localStorage.setItem('impostor_uid', myId);
    
    let myName = localStorage.getItem('impostor_name') || '';
    let myRoom = '';
    let isHost = false;

    document.getElementById('user-name').value = myName;

    const items = [
        { word: "Kladivo", hint: "Nářadí" }, { word: "Pánvička", hint: "Kuchyně" }, 
        { word: "Notebook", hint: "Elektronika" }, { word: "Postel", hint: "Nábytek" },
        { word: "Bunda", hint: "Oblečení" }, { word: "Kolo", hint: "Sport" },
        { word: "Vrtačka", hint: "Nářadí" }, { word: "Mixér", hint: "Kuchyně" },
        { word: "Lednice", hint: "Spotřebič" }, { word: "Tablet", hint: "Elektronika" },
        { word: "Gauč", hint: "Nábytek" }, { word: "Boty", hint: "Oblečení" }
    ];

    window.joinRoom = async function(create) {
        const nameInput = document.getElementById('user-name').value.trim();
        const roomInput = document.getElementById('room-id').value.trim().toUpperCase();
        
        if (!nameInput || !roomInput) return alert("Doplň jméno a kód místnosti!");
        
        const roomRef = ref(db, 'rooms/' + roomInput);
        const snapshot = await get(roomRef);
        const data = snapshot.val();

        // Ošetření existence místnosti: Pokud existuje a má aspoň jednoho hráče
        if (create) {
            if (data && data.players && Object.keys(data.players).length > 0) {
                return alert("Místnost už existuje a někdo v ní je!");
            }
            // Založení nebo přepsání prázdné místnosti
            await update(roomRef, {
                status: 'lobby',
                hostId: myId,
                createdAt: Date.now()
            });
        } else {
            if (!data || !data.players) return alert("Místnost neexistuje!");
        }

        myName = nameInput;
        myRoom = roomInput;
        localStorage.setItem('impostor_name', myName);

        const myPlayerRef = ref(db, 'rooms/' + myRoom + '/players/' + myId);
        await update(myPlayerRef, { name: myName, id: myId });

        // AUTOMATICKÉ SMAZÁNÍ PŘI ODPOJENÍ
        onDisconnect(myPlayerRef).remove();

        listenToRoom();
        document.getElementById('display-room').innerText = myRoom;
        document.getElementById('game-room-name').innerText = myRoom;
    };

    window.kickPlayer = function(targetId) {
        if (!isHost) return;
        remove(ref(db, 'rooms/' + myRoom + '/players/' + targetId));
    };

    window.leaveRoom = async function() {
        if (!myRoom) return;
        off(ref(db, 'rooms/' + myRoom));
        await remove(ref(db, 'rooms/' + myRoom + '/players/' + myId));
        resetUI();
    };

    function resetUI() {
        myRoom = '';
        isHost = false;
        showScreen('screen-login');
    }

    function listenToRoom() {
        onValue(ref(db, 'rooms/' + myRoom), (snapshot) => {
            const data = snapshot.val();
            
            // 1. Kontrola, zda mě někdo nevyhodil nebo zda místnost existuje
            if (!data || !data.players || !data.players[myId]) {
                if (myRoom) alert("Byl jsi odpojen nebo místnost zanikla.");
                resetUI();
                return;
            }

            const players = data.players;
            const playerIds = Object.keys(players);
            
            // 2. LOGIKA PŘEDÁNÍ HOSTITELE (Host Migration)
            // Pokud aktuální hostId není v seznamu hráčů, nejstarší hráč (první v poli) se stane hostem
            if (!players[data.hostId]) {
                const newHostId = playerIds.sort()[0]; 
                update(ref(db, 'rooms/' + myRoom), { hostId: newHostId });
                return; // Počkáme na další update z Firebase
            }

            isHost = (data.hostId === myId);

            // 3. Renderování seznamu hráčů s tlačítkem Kick
            document.getElementById('online-player-list').innerHTML = playerIds.map(id => {
                const p = players[id];
                const isMe = id === myId;
                const isTargetHost = id === data.hostId;
                
                return `
                <li class="bg-slate-900 border ${isMe ? 'border-indigo-500' : 'border-slate-800'} p-4 rounded-2xl flex justify-between items-center">
                    <span class="font-bold">${isTargetHost ? '👑 ' : ''}${p.name}</span>
                    <div class="flex items-center gap-3">
                        ${isMe ? '<span class="text-[10px] text-indigo-400 font-bold uppercase">Ty</span>' : ''}
                        ${isHost && !isMe ? `<button onclick="window.kickPlayer('${id}')" class="text-rose-500 text-xl font-black px-2">×</button>` : ''}
                    </div>
                </li>`;
            }).join('');

            // 4. Stavy hry
            if (data.status === 'lobby') {
                showScreen('screen-lobby');
                document.getElementById('host-start-btn').classList.toggle('hidden', !isHost || playerIds.length < 3);
                document.getElementById('wait-msg').classList.toggle('hidden', isHost);
            } else if (data.status === 'playing') {
                showScreen('screen-game');
                window.currentGameState = data.gameState;
                document.getElementById('player-turn-name').innerText = myName;
                document.getElementById('reveal-controls').classList.remove('hidden');
                document.getElementById('role-info').classList.add('hidden');
                document.getElementById('host-reset-btn').classList.toggle('hidden', !isHost);
            }
        });
    }

    window.triggerGameStart = function() {
        get(ref(db, 'rooms/' + myRoom + '/players')).then((snap) => {
            const ids = Object.keys(snap.val());
            const impIdx = Math.floor(Math.random() * ids.length);
            const item = items[Math.floor(Math.random() * items.length)];

            update(ref(db, 'rooms/' + myRoom), {
                status: 'playing',
                gameState: {
                    impostorId: ids[impIdx],
                    word: item.word,
                    hint: item.hint
                }
            });
        });
    };

    window.revealMyRole = function() {
        const state = window.currentGameState;
        const isImp = myId === state.impostorId;
        document.getElementById('role-label').innerText = isImp ? "Jsi IMPOSTOR. Kategorie:" : "Jsi CIVILISTA. Předmět:";
        document.getElementById('role-word').innerText = isImp ? state.hint : state.word;
        document.getElementById('role-word').className = `text-5xl font-black mb-8 tracking-tighter ${isImp ? 'text-rose-500' : 'text-emerald-400'}`;
        document.getElementById('reveal-controls').classList.add('hidden');
        document.getElementById('role-info').classList.remove('hidden');
    };

    function showScreen(id) {
        ['screen-login', 'screen-lobby', 'screen-game'].forEach(s => document.getElementById(s).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
</script>
</body>
</html>
