<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Impostor</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #080B14;
            --surface: #0E1320;
            --surface2: #151C2E;
            --border: rgba(255,255,255,0.07);
            --accent: #6C63FF;
            --accent2: #9B8FFF;
            --danger: #FF4D6D;
            --success: #00E5A0;
            --warning: #FFB830;
            --text: #F0EFFF;
            --muted: rgba(240,239,255,0.4);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            min-height: 100dvh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108,99,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 80%, rgba(0,229,160,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 40% 60% at 60% 30%, rgba(255,77,109,0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        #app { position: relative; z-index: 1; }
        .font-mono-custom { font-family: 'Space Mono', monospace; }

        .screen {
            display: none;
            flex-direction: column;
            min-height: 100dvh;
            padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
        }
        .screen.active { display: flex; }

        .glass {
            background: rgba(14, 19, 32, 0.8);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            transition: transform 0.12s ease, opacity 0.12s ease;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }

        .btn-primary {
            background: linear-gradient(135deg, #6C63FF 0%, #8B5CF6 100%);
            color: white;
            box-shadow: 0 8px 32px rgba(108,99,255,0.3);
        }

        .btn-secondary {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-success {
            background: linear-gradient(135deg, #00C985 0%, #00E5A0 100%);
            color: #080B14;
            box-shadow: 0 8px 32px rgba(0,229,160,0.25);
        }

        .btn-danger-ghost {
            background: rgba(255,77,109,0.1);
            color: var(--danger);
            border: 1px solid rgba(255,77,109,0.3);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: none;
        }

        .input {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 16px;
            color: var(--text);
            outline: none;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes countIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .fade-up { animation: fadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .word-reveal { animation: countIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .dot-online { background: var(--success); box-shadow: 0 0 8px rgba(0,229,160,0.7); }
        .dot-offline { background: rgba(255,77,109,0.5); }

        .role-card {
            border-radius: 24px;
            padding: 40px 24px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .role-impostor { background: rgba(255,77,109,0.1); border: 1px solid rgba(255,77,109,0.3); }
        .role-civilian { background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.2); }

        .reveal-btn {
            background: linear-gradient(135deg, var(--accent), #8B5CF6, #EC4899);
            background-size: 200% 200%;
            animation: shimmer 3s infinite linear;
            border-radius: 20px;
            height: 160px;
            font-size: 18px;
            font-weight: 800;
            color: white;
            box-shadow: 0 12px 40px rgba(108,99,255,0.4);
        }

        .room-badge {
            font-family: 'Space Mono', monospace;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 14px;
            color: var(--accent2);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .input-group { position: relative; }
        .input-label {
            position: absolute;
            top: -9px;
            left: 12px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent2);
            background: var(--bg);
            padding: 0 4px;
        }

        .icon-btn {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--danger);
        }

        .stat-box {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="screen-mode" class="screen">
        <div class="flex-1 flex flex-col justify-center px-6 py-10 max-w-md mx-auto w-full">
            <div class="mb-12 fade-up">
                <h1 style="font-size:clamp(52px,14vw,72px);font-weight:800;line-height:0.9;letter-spacing:-0.03em;">IMPOS<span style="color:var(--accent);">TOR</span></h1>
                <p style="color:var(--muted);font-size:14px;margin-top:12px;">Jeden z vás lže. Najdi ho.</p>
            </div>
            <div class="space-y-3 fade-up">
                <button onclick="window.setMode('online')" class="btn btn-primary" style="height:72px;">🌐 Online hra</button>
                <button onclick="window.setMode('local')" class="btn btn-secondary" style="height:72px;">👥 Lokální hra</button>
            </div>
        </div>
    </div>

    <div id="screen-login" class="screen">
        <div class="flex-1 flex flex-col px-6 py-6 max-w-md mx-auto w-full">
            <button onclick="window.showScreen('screen-mode')" class="btn btn-ghost" style="width:auto;align-self:flex-start;">← Zpět</button>
            <div class="flex-1 flex flex-col justify-center space-y-6">
                <h2 style="font-size:28px;font-weight:800;">Online hra</h2>
                <div class="space-y-4">
                    <div class="input-group">
                        <span class="input-label">Jméno</span>
                        <input type="text" id="user-name" placeholder="Přezdívka" class="input">
                    </div>
                    <div class="input-group">
                        <span class="input-label">Místnost</span>
                        <input type="text" id="room-id" placeholder="ABCD" class="input font-mono-custom" style="text-transform:uppercase;">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="window.joinRoom(true)" class="btn btn-primary">Založit</button>
                    <button onclick="window.joinRoom(false)" class="btn btn-secondary">Připojit</button>
                </div>
            </div>
        </div>
    </div>

    <div id="screen-local-setup" class="screen">
        <div class="flex flex-col px-6 py-6 max-w-md mx-auto w-full h-full">
            <button onclick="window.showScreen('screen-mode')" class="btn btn-ghost" style="width:auto;align-self:flex-start;">← Zpět</button>
            <h2 style="font-size:26px;font-weight:800;margin:20px 0 10px;">Lokální párty</h2>
            <div class="glass rounded-2xl p-3 mb-4 flex gap-2">
                <input type="text" id="local-player-name" placeholder="Jméno..." class="input" style="background:transparent;border:none;">
                <button onclick="window.addLocalPlayer()" class="btn btn-primary" style="width:auto;">+</button>
            </div>
            <ul id="local-player-list" class="space-y-2 flex-1 overflow-y-auto"></ul>
            <div id="local-start-wrapper" class="hidden pt-4">
                <button onclick="window.startLocalGame()" class="btn btn-success" style="height:60px;">🚀 Spustit</button>
            </div>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <div class="flex flex-col px-6 py-6 max-w-md mx-auto w-full h-full">
            <div class="flex items-center justify-between mb-6">
                <button onclick="window.leaveRoom()" class="btn btn-danger-ghost" style="width:auto;padding:10px 18px;">Odejít</button>
                <div id="display-room" class="room-badge">---</div>
            </div>
            <div class="flex gap-3 mb-4">
                <div class="stat-box"><div id="lobby-player-count" style="font-size:24px;font-weight:800;">0</div><div style="font-size:10px;color:var(--muted);">Hráčů</div></div>
                <div class="stat-box"><div style="font-size:24px;font-weight:800;color:var(--success);">3+</div><div style="font-size:10px;color:var(--muted);">Limit</div></div>
            </div>
            <ul id="online-player-list" class="space-y-2 flex-1 overflow-y-auto"></ul>
            <div id="lobby-footer" class="pt-4">
                <button id="host-start-btn" onclick="window.triggerGameStart()" class="hidden btn btn-success" style="height:60px;">🚀 Spustit</button>
                <div id="wait-msg" class="glass rounded-2xl p-4 text-center hidden">⏳ Čekáme na hostitele...</div>
            </div>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="flex flex-col px-6 py-6 max-w-md mx-auto w-full h-full">
            <div class="flex justify-between items-center mb-4">
                <div id="game-room-info" style="font-size:12px;color:var(--muted);"></div>
                <button id="in-game-leave-btn" onclick="window.leaveRoom()" class="btn btn-danger-ghost" style="width:auto;padding:8px 14px;font-size:11px;">Odejít</button>
            </div>

            <div class="glass flex-1 flex flex-col justify-center p-6 rounded-[24px]">
                <div id="turn-info" class="mb-6">
                    <span id="turn-subtitle" style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;display:block;">Aktuálně</span>
                    <h2 id="player-turn-name" style="font-size:32px;font-weight:800;">---</h2>
                </div>

                <button id="reveal-btn" onclick="window.revealMyRole()" class="btn reveal-btn">Tapni pro roli</button>

                <div id="role-info" class="hidden">
                    <div id="role-card-inner" class="role-card">
                        <p id="role-label" style="font-size:12px;font-weight:700;margin-bottom:10px;"></p>
                        <div id="role-word" style="font-size:48px;font-weight:800;margin-bottom:20px;"></div>
                        <p id="role-badge-text" style="font-size:14px;opacity:0.7;margin-bottom:20px;"></p>
                        <button onclick="window.finishReveal()" class="btn btn-secondary">Rozumím ✓</button>
                    </div>
                </div>

                <div id="discussion-ui" class="hidden text-center">
                    <span class="badge" style="background:rgba(0,229,160,0.15);color:var(--success);margin-bottom:15px;">Diskuze</span>
                    <p style="font-size:13px;color:var(--muted);">Začíná mluvit:</p>
                    <h3 id="starting-player-name" style="font-size:32px;font-weight:800;margin-bottom:20px;">---</h3>
                    <button id="host-end-round-btn" onclick="window.endRound()" class="hidden btn btn-danger-ghost">🔍 Odhalit impostora</button>
                    <button id="local-end-round-btn" onclick="window.revealLocalImpostor()" class="hidden btn btn-danger-ghost">🔍 Odhalit impostora</button>
                </div>

                <div id="end-round-ui" class="hidden text-center">
                    <h3 id="impostor-name-display" style="font-size:40px;font-weight:800;color:var(--danger);">---</h3>
                    <p style="color:var(--muted);font-size:12px;margin:10px 0;">Hledané slovo bylo:</p>
                    <div id="revealed-word" style="font-size:28px;font-weight:800;color:var(--success);">---</div>
                </div>
            </div>

            <div class="pt-4">
                <button id="host-reset-btn" onclick="window.triggerGameStart()" class="hidden btn btn-success" style="height:56px;">🔄 Další kolo</button>
                <div id="local-footer-btns" class="hidden grid grid-cols-2 gap-3">
                    <button onclick="window.showScreen('screen-local-setup')" class="btn btn-secondary">Lobby</button>
                    <button onclick="window.startLocalGame()" class="btn btn-success">Znovu</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, remove, off, onDisconnect } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA7CZjBnw597T5IsC00-2iAcuVdqegq7wU",
        authDomain: "impos-9d3d4.firebaseapp.com",
        databaseURL: "https://impos-9d3d4-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "impos-9d3d4",
        storageBucket: "impos-9d3d4.firebasestorage.app",
        messagingSenderId: "909569492432",
        appId: "1:909569492432:web:18fdf5a73d46129ef9a5d5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let myId = localStorage.getItem('impostor_uid') || 'u_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('impostor_uid', myId);

    let isOnline = false, myRoom = '', isHost = false, localPlayers = JSON.parse(localStorage.getItem('impostor_local_players')) || [], localTurnIndex = 0, hasFinishedReveal = false, roomListener = null;

    const items = [
        { word: "Kladivo", hint: "Nářadí" }, { word: "Pánvička", hint: "Kuchyně" }, { word: "Notebook", hint: "Elektronika" }, { word: "Postel", hint: "Nábytek" },
        { word: "Bunda", hint: "Oblečení" }, { word: "Kolo", hint: "Sport" }, { word: "Vrtačka", hint: "Nářadí" }, { word: "Mixér", hint: "Kuchyně" },
        { word: "Lednice", hint: "Spotřebič" }, { word: "Tablet", hint: "Elektronika" }, { word: "Gauč", hint: "Nábytek" }, { word: "Boty", hint: "Oblečení" },
        { word: "Kytara", hint: "Hudba" }, { word: "Stan", hint: "Outdoor" }, { word: "Skateboard", hint: "Sport" }, { word: "Nůžky", hint: "Kancelář" }
    ];

    // Shuffle helper
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.setMode = (mode) => {
        isOnline = (mode === 'online');
        if (isOnline) {
            document.getElementById('user-name').value = localStorage.getItem('impostor_name') || '';
            window.showScreen('screen-login');
        } else {
            window.showScreen('screen-local-setup');
            window.renderLocalPlayers();
        }
    };

    window.addLocalPlayer = () => {
        const inp = document.getElementById('local-player-name');
        if (inp.value.trim()) {
            localPlayers.push(inp.value.trim());
            inp.value = '';
            localStorage.setItem('impostor_local_players', JSON.stringify(localPlayers));
            window.renderLocalPlayers();
        }
    };

    window.renderLocalPlayers = () => {
        const list = document.getElementById('local-player-list');
        list.innerHTML = localPlayers.map((p, i) => `<li class="player-item"><span>👤 ${p}</span><button onclick="window.removeLocalPlayer(${i})" class="icon-btn">✕</button></li>`).join('');
        document.getElementById('local-start-wrapper').classList.toggle('hidden', localPlayers.length < 3);
    };

    window.removeLocalPlayer = (i) => {
        localPlayers.splice(i, 1);
        localStorage.setItem('impostor_local_players', JSON.stringify(localPlayers));
        window.renderLocalPlayers();
    };

    window.startLocalGame = () => {
        const shuffled = shuffle([...localPlayers]);
        const item = items[Math.floor(Math.random() * items.length)];
        window.currentGameState = {
            impostorName: shuffled[Math.floor(Math.random() * shuffled.length)],
            startingPlayer: shuffled[Math.floor(Math.random() * shuffled.length)],
            word: item.word, hint: item.hint
        };
        localTurnIndex = 0;
        hasFinishedReveal = false;
        window.showScreen('screen-game');
        window.updateLocalTurn();
    };

    window.updateLocalTurn = () => {
        document.getElementById('player-turn-name').innerText = localPlayers[localTurnIndex];
        document.getElementById('reveal-btn').classList.remove('hidden');
        document.getElementById('role-info').classList.add('hidden');
    };

    window.revealMyRole = () => {
        const state = window.currentGameState;
        const isImp = isOnline ? (myId === state.impostorId) : (localPlayers[localTurnIndex] === state.impostorName);
        
        const card = document.getElementById('role-card-inner');
        const word = document.getElementById('role-word');
        
        card.className = 'role-card ' + (isImp ? 'role-impostor' : 'role-civilian');
        document.getElementById('role-label').innerText = isImp ? "🎭 JSI IMPOSTOR" : "✅ JSI CIVILISTA";
        document.getElementById('role-badge-text').innerText = isImp ? `Kategorie: ${state.hint}` : `Hledáš: ${state.word}`;
        word.innerText = isImp ? state.hint : state.word;
        word.style.color = isImp ? 'var(--danger)' : 'var(--success)';
        
        document.getElementById('reveal-btn').classList.add('hidden');
        document.getElementById('role-info').classList.remove('hidden');
        
        // Reset animace
        word.classList.remove('word-reveal');
        void word.offsetWidth;
        word.classList.add('word-reveal');
    };

    window.finishReveal = () => {
        if (!isOnline) {
            localTurnIndex++;
            if (localTurnIndex < localPlayers.length) {
                window.updateLocalTurn();
            } else {
                document.getElementById('role-info').classList.add('hidden');
                document.getElementById('discussion-ui').classList.remove('hidden');
                document.getElementById('player-turn-name').innerText = "Diskuze";
                document.getElementById('starting-player-name').innerText = window.currentGameState.startingPlayer;
                document.getElementById('local-end-round-btn').classList.remove('hidden');
                document.getElementById('local-footer-btns').classList.remove('hidden');
            }
        } else {
            hasFinishedReveal = true;
            document.getElementById('role-info').classList.add('hidden');
            document.getElementById('discussion-ui').classList.remove('hidden');
            if (isHost) document.getElementById('host-end-round-btn').classList.remove('hidden');
        }
    };

    window.joinRoom = async (create) => {
        const name = document.getElementById('user-name').value.trim();
        const room = document.getElementById('room-id').value.trim().toUpperCase();
        if (!name || !room) return alert("Jméno a kód!");

        const roomRef = ref(db, 'rooms/' + room);
        const snap = await get(roomRef);
        
        if (create) {
            // Pokud zakládám, promažu stará data pokud nikdo není online
            const data = snap.val();
            const active = data?.players ? Object.values(data.players).some(p => p.isOnline !== false) : false;
            if (active) return alert("Místnost je obsazená!");
            await remove(roomRef);
            await update(roomRef, { status: 'lobby', hostId: myId });
        } else {
            if (!snap.exists()) return alert("Neexistuje!");
        }

        myRoom = room;
        localStorage.setItem('impostor_name', name);
        await update(ref(db, `rooms/${myRoom}/players/${myId}`), { name, id: myId, isOnline: true });
        onDisconnect(ref(db, `rooms/${myRoom}/players/${myId}`)).update({ isOnline: false });
        listenToRoom();
    };

    function listenToRoom() {
        if (roomListener) off(ref(db, 'rooms/' + myRoom));
        roomListener = onValue(ref(db, 'rooms/' + myRoom), (snap) => {
            const data = snap.val();
            if (!data || !data.players?.[myId]) { window.resetUI(); return; }

            isHost = (data.hostId === myId);
            const pArr = Object.values(data.players);
            const onlineCount = pArr.filter(p => p.isOnline !== false).length;
            
            document.getElementById('lobby-player-count').innerText = onlineCount;
            document.getElementById('display-room').innerText = myRoom;

            document.getElementById('online-player-list').innerHTML = pArr.map(p => `
                <li class="player-item">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full ${p.isOnline !== false ? 'dot-online' : 'dot-offline'}"></span>
                        <span style="${p.isOnline === false ? 'opacity:0.4' : ''}">${p.id === data.hostId ? '👑' : ''} ${p.name}</span>
                    </div>
                    ${isHost && p.id !== myId ? `<button onclick="window.kickPlayer('${p.id}')" class="icon-btn">✕</button>` : ''}
                </li>`).join('');

            if (data.status === 'lobby') {
                window.showScreen('screen-lobby');
                document.getElementById('host-start-btn').classList.toggle('hidden', !isHost || pArr.length < 3);
                document.getElementById('wait-msg').classList.toggle('hidden', isHost);
            } else if (data.status === 'playing') {
                window.showScreen('screen-game');
                document.getElementById('game-room-info').innerText = `Místnost: ${myRoom}`;
                
                if (data.gameState.isRevealed) {
                    document.getElementById('discussion-ui').classList.add('hidden');
                    document.getElementById('end-round-ui').classList.remove('hidden');
                    document.getElementById('impostor-name-display').innerText = data.players[data.gameState.impostorId]?.name || "Odpojen";
                    document.getElementById('revealed-word').innerText = data.gameState.word;
                    document.getElementById('host-reset-btn').classList.toggle('hidden', !isHost);
                } else {
                    window.currentGameState = data.gameState;
                    if (!hasFinishedReveal) {
                        document.getElementById('player-turn-name').innerText = data.players[myId].name;
                    }
                }
            }
        });
    }

    window.triggerGameStart = async () => {
        const snap = await get(ref(db, `rooms/${myRoom}/players`));
        const ids = shuffle(Object.keys(snap.val()));
        const item = items[Math.floor(Math.random() * items.length)];
        update(ref(db, `rooms/${myRoom}`), {
            status: 'playing',
            gameState: {
                isRevealed: false,
                impostorId: ids[Math.floor(Math.random() * ids.length)],
                startingPlayerId: ids[Math.floor(Math.random() * ids.length)],
                word: item.word, hint: item.hint, activePlayers: ids
            }
        });
        hasFinishedReveal = false;
    };

    window.endRound = () => update(ref(db, `rooms/${myRoom}/gameState`), { isRevealed: true });

    window.leaveRoom = async () => {
        if (myRoom) await remove(ref(db, `rooms/${myRoom}/players/${myId}`));
        window.resetUI();
    };

    window.resetUI = () => {
        if (roomListener) off(ref(db, 'rooms/' + myRoom));
        myRoom = ''; isHost = false; hasFinishedReveal = false;
        window.showScreen('screen-mode');
    };

    window.kickPlayer = (id) => remove(ref(db, `rooms/${myRoom}/players/${id}`));
    window.showScreen('screen-mode');
</script>
</body>
</html>
